name: Generate TFJS Plant Disease Model

on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git

      - name: Clone candidate model repo
        run: |
          rm -rf temp_repo
          # Try the user-requested repo first, then fallback to the other candidate
          git clone --depth 1 https://github.com/amanparmar17/Leaf_diesease-Detection temp_repo || \
            git clone --depth 1 https://github.com/DhruvMakwana/Plant-Disease-Classification temp_repo || true

      - name: Create models folder
        run: |
          mkdir -p models/plant_disease

      - name: Copy any pre-trained Keras model (.h5) if present
        id: copy_model
        run: |
          set -e
          # prefer top-level model.h5
          if [ -f temp_repo/model.h5 ]; then
            cp temp_repo/model.h5 models/plant_disease/model.h5
            echo "found=1" >> $GITHUB_OUTPUT
            exit 0
          fi
          # otherwise find any .h5
          found=$(find temp_repo -type f -name "*.h5" | head -n1 || true)
          if [ -n "$found" ]; then
            cp "$found" models/plant_disease/model.h5
            echo "found=1" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "found=0" >> $GITHUB_OUTPUT

      - name: Upload model.h5 artifact (if copied)
        if: steps.copy_model.outputs.found == '1'
        uses: actions/upload-artifact@v4
        with:
          name: plant_model_h5
          path: models/plant_disease/model.h5

      - name: Attempt to train model locally (if no .h5 found)
        if: steps.copy_model.outputs.found == '0'
        env:
          TRAIN_SAMPLES: 500
          TRAIN_EPOCHS: 1
          TRAIN_BATCH: 16
          SKIP_TFJS_CONVERT: "1"
        run: |
          set -e
          echo "No pretrained .h5 found; attempting to train a lightweight model using TensorFlow Datasets (PlantVillage)"
          python -m pip install --upgrade pip
          python -m pip install tensorflow==2.12.0 tensorflow-datasets==4.9.2 h5py
          python scripts/train_and_convert.py || (echo "Training failed" && exit 1)

      - name: Verify model.h5 after training
        id: verify_after_train
        run: |
          if [ -f models/plant_disease/model.h5 ]; then
            echo "model_h5_exists=1" >> $GITHUB_OUTPUT
          else
            echo "model_h5_exists=0" >> $GITHUB_OUTPUT
          fi

      - name: Upload trained model.h5 artifact
        if: steps.copy_model.outputs.found == '0' && contains(steps.verify_after_train.outputs.model_h5_exists, '1')
        uses: actions/upload-artifact@v4
        with:
          name: plant_model_h5
          path: models/plant_disease/model.h5

      - name: Fail gracefully if training couldn't produce model.h5
        if: steps.copy_model.outputs.found == '0' && contains(steps.verify_after_train.outputs.model_h5_exists, '0')
        run: |
          echo "Training attempted but no models/plant_disease/model.h5 was produced. Please provide a pre-trained Keras .h5 or adjust the training parameters."
          exit 1
