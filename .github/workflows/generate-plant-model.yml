name: Generate TFJS Plant Disease Model

on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git

      - name: Clone candidate model repo
        run: |
          rm -rf temp_repo
          # Try the user-requested repo first, then fallback to the other candidate
          git clone --depth 1 https://github.com/amanparmar17/Leaf_diesease-Detection temp_repo || \
            git clone --depth 1 https://github.com/DhruvMakwana/Plant-Disease-Classification temp_repo || true

      - name: Create models folder
        run: |
          mkdir -p models/plant_disease

      - name: Copy any pre-trained Keras model (.h5) if present
        id: copy_model
        run: |
          set -e
          # prefer top-level model.h5
          if [ -f temp_repo/model.h5 ]; then
            cp temp_repo/model.h5 models/plant_disease/model.h5
            echo "found=1" >> $GITHUB_OUTPUT
            exit 0
          fi
          # otherwise find any .h5
          found=$(find temp_repo -type f -name "*.h5" | head -n1 || true)
          if [ -n "$found" ]; then
            cp "$found" models/plant_disease/model.h5
            echo "found=1" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "found=0" >> $GITHUB_OUTPUT

      - name: Upload model.h5 artifact (if copied)
        if: steps.copy_model.outputs.found == '1'
        uses: actions/upload-artifact@v4
        with:
          name: plant_model_h5
          path: models/plant_disease/model.h5

      - name: Attempt to train model locally (if no .h5 found)
        if: steps.copy_model.outputs.found == '0'
        env:
          TRAIN_SAMPLES: 500
          TRAIN_EPOCHS: 1
          TRAIN_BATCH: 16
          SKIP_TFJS_CONVERT: "1"
        run: |
          set -e
          echo "No pretrained .h5 found; attempting to train a lightweight model using TensorFlow Datasets (PlantVillage)"
          python -m pip install --upgrade pip
          python -m pip install tensorflow==2.12.0 tensorflow-datasets==4.9.2 h5py
          python scripts/train_and_convert.py || (echo "Training failed" && exit 1)

      - name: Verify model.h5 after training
        id: verify_after_train
        run: |
          if [ -f models/plant_disease/model.h5 ]; then
            echo "model_h5_exists=1" >> $GITHUB_OUTPUT
          else
            echo "model_h5_exists=0" >> $GITHUB_OUTPUT
          fi

      - name: Upload trained model.h5 artifact
        if: steps.copy_model.outputs.found == '0' && contains(steps.verify_after_train.outputs.model_h5_exists, '1')
        uses: actions/upload-artifact@v4
        with:
          name: plant_model_h5
          path: models/plant_disease/model.h5

      - name: Attempt download of user-provided model.h5 URL(s)
        if: steps.copy_model.outputs.found == '0' && contains(steps.verify_after_train.outputs.model_h5_exists, '0')
        run: |
          set -e
          echo "Trying to download user-provided model.h5 from candidate URLs"
          mkdir -p models/plant_disease
          urls=(
            "https://productionresultssa7.blob.core.windows.net/actions-results/8b84a601-25cd-4b27-95ae-37f2c8cedf18/workflow-job-run-d55bc7ce-fc2b-5f50-ae30-1f01fd22d0bf/artifacts/e53ab1bbf79841d8323187a487424c55b588f125ba62a1a70c73c98b71f62acc.zip?rscd=attachment%3B+filename%3D%22plant_model_h5.zip%22&se=2025-11-03T12%3A45%3A15Z&sig=qQkAk0hdR8bDtJKemdeCaV5EQp2MzWEOuSAa8Sbzfck%3D&ske=2025-11-04T00%3A25%3A51Z&sks=b&skt=2025-11-03T12%3A25%3A51Z&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skv=2025-11-05&sp=r&spr=https&sr=b&st=2025-11-03T12%3A35%3A10Z&sv=2025-11-05"
            "https://cdn.builder.io/o/assets%2F9a08e76889074a27806519bd7e3ac637%2F36b0adc174b14a388a4bef7a09acec16?alt=media&token=a4e7142e-c4ea-4a6f-8e88-bf6d94c59ed6&apiKey=9a08e76889074a27806519bd7e3ac637"
            "https://cdn.builder.io/o/assets%2F9a08e76889074a27806519bd7e3ac637%2F92f857e71e714e28becce0b426717877?alt=media&token=9133030f-c8ce-4083-a018-d03c6e64d002&apiKey=9a08e76889074a27806519bd7e3ac637"
          )
          success=0
          for u in "${urls[@]}"; do
            echo "Attempting $u"
            if curl -L --fail -o models/plant_disease/model.h5 "$u"; then
              echo "Downloaded model.h5 from $u"
              success=1
              break
            else
              echo "Failed to download from $u"
              rm -f models/plant_disease/model.h5 || true
            fi
          done
          if [ "$success" -ne 1 ]; then
            echo "All download attempts failed"
            exit 1
          fi

      - name: Convert downloaded model.h5 to TFJS (Docker)
        if: steps.copy_model.outputs.found == '0' && contains(steps.verify_after_train.outputs.model_h5_exists, '0')
        run: |
          set -e
          if [ ! -f models/plant_disease/model.h5 ]; then echo "No model.h5 to convert"; exit 1; fi
          echo "Using Docker to convert model.h5 to TFJS format"
          docker run --rm -v "$PWD/models/plant_disease":/models -w /models python:3.10-slim bash -lc "pip install --upgrade pip && pip install tensorflow==2.11.0 tensorflowjs==3.14.0 h5py && tensorflowjs_converter --input_format=keras model.h5 ."

      - name: Verify model.json after download+convert
        id: verify_download_convert
        run: |
          if [ -f models/plant_disease/model.json ]; then
            echo "model_exists=1" >> $GITHUB_OUTPUT
          else
            echo "model_exists=0" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push converted model (from downloaded artifact)
        if: steps.copy_model.outputs.found == '0' && contains(steps.verify_download_convert.outputs.model_exists, '1')
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add models/plant_disease -f || true
          git commit -m "chore: add converted TFJS plant disease model (downloaded)" || echo "no changes to commit"
          git push origin HEAD:main || echo "push failed"

      - name: Fail gracefully if training and download couldn't produce model.h5
        if: steps.copy_model.outputs.found == '0' && contains(steps.verify_after_train.outputs.model_h5_exists, '0') && contains(steps.verify_download_convert.outputs.model_exists, '0')
        run: |
          echo "Training and download attempted but no models/plant_disease/model.h5 or model.json was produced. Please provide a valid Keras .h5 or adjust the training parameters."
          exit 1
