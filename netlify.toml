[build]
  command = "pnpm install --no-frozen-lockfile && npm run build:client"
  functions = "netlify/functions"
  publish = "dist/spa"

[build.environment]
  PNPM_FLAGS = "--no-frozen-lockfile"
  # Netlify environment variables for Gemini API
  # These should be set in the Netlify Dashboard under Site settings > Build & deploy > Environment variables
  # Required: GOOGLE_API_KEY (your Google Generative AI API key)


[functions]
  external_node_modules = []
  node_bundler = "esbuild"

[[redirects]]
  force = true
  from = "/api/*"
  status = 200
  to = "/.netlify/functions/api/:splat"
